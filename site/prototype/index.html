<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FabricTools Docs</title>
<meta name="description" content="FabricTools documentation prototype - Command Explorer generated from docs/en-US.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f8f8;
  --surface: #ffffff;
  --surface-2: #f0f3f2;
  --border: #dde3e1;
  --text: #1a2421;
  --muted: #5d6b67;
  --accent: #0c7a5f;
  --accent-soft: #e2f3ee;
  --accent-text: #ffffff;
  --code-bg: #f2f5f4;
  --warn: #9a5b00;
  --shadow: 0 1px 2px rgba(16, 40, 32, .06), 0 4px 16px rgba(16, 40, 32, .05);
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #161e1b; --surface-2: #1c2622; --border: #2a3632;
    --text: #e3ebe8; --muted: #93a39e; --accent: #3ccf9f; --accent-soft: #173a2f;
    --accent-text: #08130f; --code-bg: #111a17; --warn: #f0b45c;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --surface-2: #1c2622; --border: #2a3632;
  --text: #e3ebe8; --muted: #93a39e; --accent: #3ccf9f; --accent-soft: #173a2f;
  --accent-text: #08130f; --code-bg: #111a17; --warn: #f0b45c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: var(--mono); font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Header */
header.top {
  position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
}
.top-inner { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--text); font-size: 17px; }
.brand:hover { text-decoration: none; }
.logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-text);
  display: grid; place-items: center; font: 700 13px var(--mono); }
.badge-preview { font: 600 11px var(--sans); color: var(--warn); border: 1px solid currentColor; border-radius: 99px; padding: 1px 8px; }
.badge-version { font: 600 12px var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 2px 9px; }
.badge-version:hover { text-decoration: none; filter: brightness(.97); }
.release { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 14px; font-size: 14px; color: var(--muted); }
.release strong { color: var(--text); font-family: var(--mono); font-weight: 600; }
.top nav { margin-left: auto; display: flex; gap: 4px; align-items: center; }
.top nav a, .icon-btn { color: var(--muted); padding: 6px 10px; border-radius: 6px; font-weight: 500; font-size: 14px; }
.top nav a:hover, .icon-btn:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
.icon-btn { background: none; border: 0; cursor: pointer; font: inherit; }

/* Explorer */
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
.hero { padding: 40px 0 8px; }
.hero h1 { margin: 0 0 6px; font-size: clamp(24px, 4vw, 34px); letter-spacing: -.02em; }
.hero p { margin: 0 0 18px; color: var(--muted); }
.install { display: inline-flex; align-items: center; gap: 10px; background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 6px 6px 14px; max-width: 100%; }
.install code { white-space: nowrap; overflow: auto; }
.search-row { margin: 28px 0 14px; position: relative; }
.search-row input {
  width: 100%; padding: 14px 110px 14px 46px; font: 16px var(--sans); color: var(--text);
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
}
.search-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-row svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search-row .count { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; }
kbd { font: 500 11px var(--mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); background: var(--surface); }
.filters { display: grid; grid-template-columns: 84px 1fr; gap: 8px 12px; align-items: start; margin-bottom: 20px; }
.filters .label { color: var(--muted); font-size: 13px; font-weight: 600; padding-top: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 99px;
  padding: 3px 11px; font: 500 13px var(--sans); cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--accent); }
.chip .n { color: var(--muted); font-weight: 400; margin-left: 4px; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .8; }
.chip.more { color: var(--accent); border-style: dashed; }
.results { padding-bottom: 60px; }
.group { margin-bottom: 18px; }
.group h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
.group h2 a { color: inherit; }
.list { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(220px, 330px) 1fr auto; gap: 16px; align-items: baseline;
  padding: 9px 14px; border-top: 1px solid var(--border); color: var(--text); }
.row:first-child { border-top: 0; }
.row:hover, .row.active { background: var(--accent-soft); text-decoration: none; }
.row .name { font: 500 13.5px var(--mono); overflow-wrap: anywhere; }
.row .syn { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.row .type { font-size: 12px; color: var(--muted); white-space: nowrap; }
mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; border-radius: 2px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }

/* Command page */
.doc { max-width: 1280px; margin: 0 auto; padding: 0 16px; display: grid; grid-template-columns: 240px minmax(0, 1fr) 210px; gap: 32px; }
.side { position: sticky; top: 57px; align-self: start; max-height: calc(100vh - 57px); overflow: auto; padding: 24px 0; font-size: 14px; }
.side h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.side a { display: block; padding: 3px 10px; border-radius: 6px; color: var(--muted); overflow-wrap: anywhere; }
.side a:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
.side a.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.side .back { margin-bottom: 16px; color: var(--accent); padding-left: 0; }
.side .back:hover { background: none; text-decoration: underline; }
.side.right a { font-family: var(--sans); }
.side .block { margin-bottom: 22px; }
article { padding: 24px 0 80px; min-width: 0; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.crumbs a { color: var(--muted); }
article h1 { font: 600 clamp(22px, 3.4vw, 30px)/1.25 var(--mono); margin: 0 0 10px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.tags { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.tag.verb { background: var(--surface-2); color: var(--text); }
.lead { font-size: 17px; margin: 0 0 8px; }
article h2 { font-size: 20px; margin: 36px 0 12px; padding-top: 8px; border-top: 1px solid var(--border); scroll-margin-top: 70px; }
article h3 { font-size: 15px; margin: 22px 0 8px; scroll-margin-top: 70px; }
.md p { margin: 0 0 12px; }
.md ul { margin: 0 0 12px; padding-left: 20px; }
.md code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.code { position: relative; margin: 0 0 14px; }
.code pre { margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow: auto; line-height: 1.55; }
.code pre code { background: none; border: 0; padding: 0; }
.code.syntax pre { white-space: pre-wrap; }
.code .set { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
.copy { position: absolute; top: 6px; right: 6px; font: 500 12px var(--sans); background: var(--surface); color: var(--muted);
  border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; opacity: 0; transition: opacity .15s; }
.code:hover .copy, .copy:focus { opacity: 1; }
.tok-cmd { color: var(--accent); font-weight: 500; }
.tok-param { color: #6f4bc8; }
.tok-var { color: #b4561c; }
.tok-str { color: #3c7a1c; }
.tok-com { color: var(--muted); font-style: italic; }
:root[data-theme="dark"] .tok-param { color: #b79cff; } :root[data-theme="dark"] .tok-var { color: #f0a066; } :root[data-theme="dark"] .tok-str { color: #9fd67a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tok-param { color: #b79cff; } :root:not([data-theme="light"]) .tok-var { color: #f0a066; } :root:not([data-theme="light"]) .tok-str { color: #9fd67a; } }
.params { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: table; }
.params th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); padding: 8px 12px; font-weight: 600; }
.params td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: top; }
.params th, .params td.pn, .params td.pt, .params td.c { width: 1%; white-space: nowrap; }
.params th.d, .params td.desc { width: auto; white-space: normal; min-width: 260px; }
.params td.pn { font: 500 13px var(--mono); }
.params td.pn .alias { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
.params td.pt { font: 12.5px var(--mono); color: var(--muted); }
.params td.c { text-align: center; }
.params .req { color: var(--accent); font-weight: 700; }
.params .desc p { margin: 0 0 4px; }
.params .def { font-size: 12.5px; color: var(--muted); }
.table-scroll { overflow-x: auto; border-radius: 10px; }
.foot-links { display: flex; gap: 16px; margin-top: 40px; font-size: 14px; flex-wrap: wrap; }
.notice { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; margin-top: 14px; }

@media (max-width: 1100px) { .doc { grid-template-columns: 220px minmax(0, 1fr); } .side.right { display: none; } }
@media (max-width: 760px) {
  .doc { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .side.left { position: static; max-height: none; padding-bottom: 0; }
  .side.left .block { display: none; }
  .row { grid-template-columns: 1fr; gap: 2px; }
  .row .type { display: none; }
  .filters { grid-template-columns: 1fr; }
  .filters .label { padding-top: 0; }
  .top nav a.hide-sm { display: none; }
  .search-row .count { display: none; }
  .search-row input { padding-right: 14px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="#/"><span class="logo">FT</span>FabricTools</a>
    <a class="badge-version" id="version" href="https://github.com/dataplat/FabricTools/releases/latest" target="_blank" rel="noopener" hidden></a>
    <span class="badge-preview">Public Preview</span>
    <nav>
      <a href="#/">Commands</a>
      <a class="hide-sm" href="https://github.com/dataplat/FabricTools" target="_blank" rel="noopener">GitHub</a>
      <a class="hide-sm" href="https://www.powershellgallery.com/packages/FabricTools" target="_blank" rel="noopener">Gallery</a>
      <button class="icon-btn" id="theme" type="button" title="Toggle theme" aria-label="Toggle theme">◐</button>
    </nav>
  </div>
</header>
<main id="app"></main>

<script src="commands.js"></script>
<script>
(() => {
  'use strict';
  const REPO = 'https://github.com/dataplat/FabricTools';
  const BRANCH = 'develop';
  const CMDS = (window.FABRIC_COMMANDS || []).slice().sort((a, b) => a.name.localeCompare(b.name));
  const BY_NAME = new Map(CMDS.map(c => [c.name.toLowerCase(), c]));
  const META = window.FABRIC_META || {};
  if (META.version) {
    const v = document.getElementById('version');
    v.textContent = 'v' + META.version;
    v.title = 'Latest release' + (META.date ? ' (' + META.date + ')' : '');
    v.hidden = false;
  }
  const VERB_ORDER = ['Get', 'New', 'Update', 'Remove', 'Add', 'Set', 'Invoke', 'Start', 'Stop', 'Connect', 'Disconnect', 'Export', 'Import'];
  const verbRank = v => { const i = VERB_ORDER.indexOf(v); return i < 0 ? 99 : i; };
  const app = document.getElementById('app');

  // ---------- theme ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
  };
  const savedTheme = store.get('ft-theme');
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  document.getElementById('theme').addEventListener('click', () => {
    const dark = document.documentElement.dataset.theme
      ? document.documentElement.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    store.set('ft-theme', next);
  });

  // ---------- helpers ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const count = (arr, key) => arr.reduce((m, x) => (m[x[key]] = (m[x[key]] || 0) + 1, m), {});
  const typeOrder = (a, b) => (a === 'Core' ? -1 : b === 'Core' ? 1 : a.localeCompare(b));
  const cmdHref = name => '#/cmd/' + encodeURIComponent(name);

  function inline(text) {
    let s = esc(text);
    s = s.replace(/`([^`]+)`/g, (_, c) => {
      const hit = BY_NAME.get(c.toLowerCase());
      return hit ? `<a href="${cmdHref(hit.name)}"><code>${c}</code></a>` : `<code>${c}</code>`;
    });
    s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return s;
  }

  function highlightPS(code) {
    const re = /(#[^\n]*)|('(?:[^']|'')*'|"(?:[^"`]|`.)*")|(\$[\w:]+)|(\s-[A-Za-z][\w]*)|(\b[A-Z][a-z]+-[A-Za-z0-9]+\b)/g;
    let out = '', last = 0, m;
    while ((m = re.exec(code))) {
      out += esc(code.slice(last, m.index));
      const t = esc(m[0]);
      if (m[1]) out += `<span class="tok-com">${t}</span>`;
      else if (m[2]) out += `<span class="tok-str">${t}</span>`;
      else if (m[3]) out += `<span class="tok-var">${t}</span>`;
      else if (m[4]) out += `<span class="tok-param">${t}</span>`;
      else {
        const hit = BY_NAME.get(m[0].toLowerCase());
        out += hit ? `<a class="tok-cmd" href="${cmdHref(hit.name)}">${t}</a>` : `<span class="tok-cmd">${t}</span>`;
      }
      last = m.index + m[0].length;
    }
    return out + esc(code.slice(last));
  }

  const codeBlock = (code, label, cls = '') =>
    `<div class="code ${cls}">${label ? `<div class="set">${esc(label)}</div>` : ''}<pre><code>${highlightPS(code)}</code></pre><button class="copy" type="button" data-copy="${esc(code)}">Copy</button></div>`;

  function md(text) {
    if (!text) return '';
    const lines = text.split('\n');
    let html = '', para = [], list = [], i = 0;
    const flushP = () => { if (para.length) { html += `<p>${inline(para.join(' '))}</p>`; para = []; } };
    const flushL = () => { if (list.length) { html += `<ul>${list.map(li => `<li>${inline(li)}</li>`).join('')}</ul>`; list = []; } };
    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) {
        flushP(); flushL();
        const buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        html += codeBlock(buf.join('\n'));
      } else if (/^\s*[-*]\s+/.test(line)) {
        flushP(); list.push(line.replace(/^\s*[-*]\s+/, ''));
      } else if (!line.trim()) {
        flushP(); flushL();
      } else if (list.length && /^\s+/.test(line)) {
        list[list.length - 1] += ' ' + line.trim();
      } else {
        flushL(); para.push(line.trim());
      }
      i++;
    }
    flushP(); flushL();
    return html;
  }

  // Some help files write example code without ``` fences; wrap lines that look like PowerShell.
  function exampleMd(text) {
    if (!text || text.includes('```')) return md(text);
    const isCode = l => /^\s*(\$\w|[A-Z][a-z]+-[A-Z]\w+|\.\\|#\s|\||@\{|\}|foreach|if\s*\()/.test(l);
    const out = [];
    let inCode = false;
    for (const line of text.split('\n')) {
      const code = isCode(line) || (inCode && /^\s+\S/.test(line));
      if (code && !inCode) { out.push('```'); inCode = true; }
      if (!code && inCode && line.trim()) { out.push('```'); inCode = false; }
      out.push(line);
    }
    if (inCode) out.push('```');
    return md(out.join('\n').replace(/\n+```/g, '\n```'));
  }

  // ---------- routing ----------
  function parseHash() {
    const h = location.hash.replace(/^#/, '');
    if (h.startsWith('/cmd/')) return { view: 'cmd', name: decodeURIComponent(h.slice(5)) };
    const qs = new URLSearchParams(h.split('?')[1] || '');
    return { view: 'explore', q: qs.get('q') || '', type: qs.get('type') || '', verb: qs.get('verb') || '' };
  }

  function setExploreHash(state) {
    const qs = new URLSearchParams();
    if (state.q) qs.set('q', state.q);
    if (state.type) qs.set('type', state.type);
    if (state.verb) qs.set('verb', state.verb);
    const s = qs.toString();
    history.replaceState(null, '', '#/' + (s ? '?' + s : ''));
  }

  // ---------- search ----------
  function score(c, tokens) {
    if (!tokens.length) return 1;
    const name = c.name.toLowerCase(), noun = c.noun.toLowerCase(), type = c.itemType.toLowerCase().replace(/\s+/g, '');
    const syn = c.synopsis.toLowerCase();
    let total = 0;
    for (const t of tokens) {
      let s = 0;
      if (name === t) s = 100;
      else if (c.verb.toLowerCase() === t) s = 30;
      else if (noun.startsWith('fabric' + t) || noun.startsWith(t)) s = 40;
      else if (name.includes(t)) s = 25;
      else if (type.includes(t)) s = 15;
      else if (syn.includes(t)) s = 5;
      if (!s) return 0;
      total += s;
    }
    return total - name.length * 0.05;
  }

  function mark(text, tokens) {
    let s = esc(text);
    if (!tokens.length) return s;
    const re = new RegExp('(' + tokens.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    return s.replace(re, '<mark>$1</mark>');
  }

  // ---------- explorer view ----------
  let showAllTypes = false;
  const TOP_TYPES = 14;

  function renderExplorer(state) {
    document.title = 'FabricTools Docs';
    app.innerHTML = `
      <div class="wrap">
        <section class="hero">
          <h1>PowerShell for Microsoft Fabric</h1>
          <p>Automate Microsoft Fabric and Power BI administration: ${CMDS.length} commands across ${Object.keys(count(CMDS, 'itemType')).length} item types.</p>
          <div class="install"><code>Install-Module FabricTools</code><button class="copy" style="position:static;opacity:1" type="button" data-copy="Install-Module FabricTools">Copy</button></div>
          ${META.version ? `<div class="release">
            <span>Latest release <strong>v${esc(META.version)}</strong>${META.date ? ` · ${esc(META.date)}` : ''}</span>
            <a href="${REPO}/releases/tag/v${encodeURIComponent(META.version)}" target="_blank" rel="noopener">Release notes</a>
            <a href="${REPO}/blob/${BRANCH}/CHANGELOG.md" target="_blank" rel="noopener">Changelog</a>
          </div>` : ''}
        </section>
        <div class="search-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search commands, e.g. get lakehouse" aria-label="Search commands" value="${esc(state.q)}">
          <span class="count" id="count"></span>
        </div>
        <div class="filters">
          <div class="label">Item type</div><div class="chips" id="types"></div>
          <div class="label">Verb</div><div class="chips" id="verbs"></div>
        </div>
        <div class="results" id="results"></div>
      </div>`;
    const input = document.getElementById('q');
    input.addEventListener('input', () => { state.q = input.value; update(state); });
    input.addEventListener('keydown', e => onListKey(e));
    update(state);
    if (!matchMedia('(max-width: 760px)').matches) input.focus();
  }

  let activeIndex = -1;

  function update(state) {
    setExploreHash(state);
    const tokens = state.q.toLowerCase().split(/[\s-]+/).filter(Boolean);
    const matchQ = CMDS.map(c => ({ c, s: score(c, tokens) })).filter(x => x.s > 0);

    // chip counts reflect the other active filters
    const typeCounts = count(matchQ.filter(x => !state.verb || x.c.verb === state.verb).map(x => x.c), 'itemType');
    const verbCounts = count(matchQ.filter(x => !state.type || x.c.itemType === state.type).map(x => x.c), 'verb');
    const allTypes = [...new Set(CMDS.map(c => c.itemType))].sort(typeOrder);
    const allVerbs = [...new Set(CMDS.map(c => c.verb))].sort((a, b) => verbRank(a) - verbRank(b) || a.localeCompare(b));

    let types = allTypes.filter(t => typeCounts[t] || t === state.type);
    const hidden = !showAllTypes && types.length > TOP_TYPES ? types.length - TOP_TYPES : 0;
    if (hidden) {
      const top = types.filter(t => t === 'Core' || t === state.type);
      const rest = types.filter(t => !top.includes(t)).sort((a, b) => typeCounts[b] - typeCounts[a] || a.localeCompare(b)).slice(0, TOP_TYPES - top.length);
      types = types.filter(t => top.includes(t) || rest.includes(t));
    }
    const chip = (kind, value, label, n, on) =>
      `<button class="chip" type="button" data-${kind}="${esc(value)}" aria-pressed="${on}">${esc(label)}${n != null ? `<span class="n">${n}</span>` : ''}</button>`;
    document.getElementById('types').innerHTML =
      chip('type', '', 'All', null, !state.type) +
      types.map(t => chip('type', t, t, typeCounts[t] || 0, state.type === t)).join('') +
      (hidden ? `<button class="chip more" type="button" data-more="1">+ ${hidden} more</button>`
              : (showAllTypes ? `<button class="chip more" type="button" data-more="0">Show fewer</button>` : ''));
    document.getElementById('verbs').innerHTML =
      chip('verb', '', 'All', null, !state.verb) +
      allVerbs.filter(v => verbCounts[v] || v === state.verb).map(v => chip('verb', v, v, verbCounts[v] || 0, state.verb === v)).join('');

    document.querySelectorAll('[data-type]').forEach(b => b.onclick = () => { state.type = state.type === b.dataset.type ? '' : b.dataset.type; update(state); });
    document.querySelectorAll('[data-verb]').forEach(b => b.onclick = () => { state.verb = state.verb === b.dataset.verb ? '' : b.dataset.verb; update(state); });
    document.querySelectorAll('[data-more]').forEach(b => b.onclick = () => { showAllTypes = b.dataset.more === '1'; update(state); });

    const hits = matchQ.filter(x => (!state.type || x.c.itemType === state.type) && (!state.verb || x.c.verb === state.verb));
    document.getElementById('count').textContent = `${hits.length} of ${CMDS.length}`;
    const row = (c, showType) =>
      `<a class="row" href="${cmdHref(c.name)}"><span class="name">${mark(c.name, tokens)}</span><span class="syn">${mark(c.synopsis, tokens)}</span>${showType ? `<span class="type">${esc(c.itemType)}</span>` : '<span></span>'}</a>`;

    let html;
    if (!hits.length) {
      html = `<div class="empty">No commands match. Try fewer words or clear the filters.</div>`;
    } else if (tokens.length) {
      hits.sort((a, b) => b.s - a.s || a.c.name.localeCompare(b.c.name));
      html = `<div class="list">${hits.map(x => row(x.c, true)).join('')}</div>`;
    } else {
      const groups = {};
      hits.forEach(x => (groups[x.c.itemType] ||= []).push(x.c));
      html = Object.keys(groups).sort(typeOrder).map(t => {
        const items = groups[t].sort((a, b) => a.noun.localeCompare(b.noun) || verbRank(a.verb) - verbRank(b.verb));
        return `<section class="group"><h2>${esc(t)}<span>${items.length}</span></h2><div class="list">${items.map(c => row(c, false)).join('')}</div></section>`;
      }).join('');
    }
    document.getElementById('results').innerHTML = html;
    activeIndex = -1;
  }

  function onListKey(e) {
    const rows = [...document.querySelectorAll('#results .row')];
    if (!rows.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      activeIndex = Math.max(0, Math.min(rows.length - 1, activeIndex + (e.key === 'ArrowDown' ? 1 : -1)));
    } else if (e.key === 'Enter') {
      location.hash = rows[Math.max(0, activeIndex)].getAttribute('href');
      return;
    } else return;
    rows.forEach((r, i) => r.classList.toggle('active', i === activeIndex));
    rows[activeIndex].scrollIntoView({ block: 'nearest' });
  }

  // ---------- command view ----------
  function renderCommand(name) {
    const c = BY_NAME.get(name.toLowerCase());
    if (!c) {
      app.innerHTML = `<div class="wrap"><div class="empty">Command <code>${esc(name)}</code> was not found. <a href="#/">Back to all commands</a></div></div>`;
      return;
    }
    document.title = `${c.name} - FabricTools Docs`;
    const siblings = CMDS.filter(x => x.itemType === c.itemType).sort((a, b) => a.noun.localeCompare(b.noun) || verbRank(a.verb) - verbRank(b.verb));
    const related = CMDS.filter(x => x.noun === c.noun && x.name !== c.name).sort((a, b) => verbRank(a.verb) - verbRank(b.verb));
    const sections = [];
    const sec = (id, title, body) => { if (body) sections.push({ id, title, body }); };

    sec('syntax', 'Syntax', c.syntax.map(s => codeBlock(s.code, s.set ? `Parameter set: ${s.set}` : '', 'syntax')).join(''));
    sec('description', 'Description', md(c.description) + (c.aliases ? `<p><strong>Aliases:</strong> ${inline(c.aliases)}</p>` : ''));
    sec('examples', 'Examples', c.examples.map(ex =>
      `<h3 id="${slug(ex.title)}">${esc(ex.title.replace(/^EXAMPLE/i, 'Example'))}</h3><div class="md">${exampleMd(ex.body)}</div>`).join(''));
    if (c.parameters.length) {
      const yes = '<span class="req" title="Yes">✓</span>';
      const rows = c.parameters
        .slice().sort((a, b) => (b.required - a.required))
        .map(p => {
          const pipe = p.pipeline ? 'Value' : p.pipelineByName ? 'By name' : '–';
          return `<tr>
            <td class="pn">-${esc(p.name)}${p.aliases ? `<span class="alias">alias: ${esc(p.aliases)}</span>` : ''}</td>
            <td class="pt" title="${esc(p.fullType)}">${esc(p.type)}</td>
            <td class="c">${p.required ? yes : ''}</td>
            <td class="c">${esc(p.position || '')}</td>
            <td class="c">${pipe}</td>
            <td class="desc">${md(p.description)}${p.default ? `<div class="def">Default: <code>${esc(p.default)}</code></div>` : ''}</td>
          </tr>`;
        }).join('');
      sec('parameters', 'Parameters',
        `<div class="table-scroll"><table class="params"><thead><tr><th>Name</th><th>Type</th><th>Req.</th><th>Pos.</th><th>Pipeline</th><th class="d">Description</th></tr></thead><tbody>${rows}</tbody></table></div>
         <p class="notice">This cmdlet also supports the common parameters, such as -Verbose and -ErrorAction. See <a href="https://learn.microsoft.com/powershell/module/microsoft.powershell.core/about/about_commonparameters" target="_blank" rel="noopener">about_CommonParameters</a>.</p>`);
    }
    sec('inputs', 'Inputs', md(c.inputs));
    sec('outputs', 'Outputs', md(c.outputs));
    sec('notes', 'Notes', `<div class="md">${md(c.notes)}</div>`);

    app.innerHTML = `
      <div class="doc">
        <aside class="side left">
          <a class="back" href="#/?type=${encodeURIComponent(c.itemType)}">← All ${esc(c.itemType)} commands</a>
          <div class="block">
            <h4>${esc(c.itemType)}</h4>
            ${siblings.map(s => `<a class="mono${s.name === c.name ? ' cur' : ''}" href="${cmdHref(s.name)}">${esc(s.name)}</a>`).join('')}
          </div>
        </aside>
        <article>
          <div class="crumbs"><a href="#/">Commands</a> / <a href="#/?type=${encodeURIComponent(c.itemType)}">${esc(c.itemType)}</a></div>
          <h1>${esc(c.name)}</h1>
          <div class="tags"><span class="tag">${esc(c.itemType)}</span><span class="tag verb">${esc(c.verb)}</span></div>
          <p class="lead">${inline(c.synopsis)}</p>
          ${sections.map(s => `<h2 id="${s.id}">${s.title}</h2><div class="md">${s.body}</div>`).join('')}
          <div class="foot-links">
            <a href="${REPO}/edit/${BRANCH}/${c.source}" target="_blank" rel="noopener">Edit this page on GitHub</a>
            <a href="${REPO}/issues/new?title=${encodeURIComponent('Docs: ' + c.name)}" target="_blank" rel="noopener">Report a docs issue</a>
          </div>
        </article>
        <aside class="side right">
          <div class="block">
            <h4>On this page</h4>
            ${sections.map(s => `<a href="#/cmd/${encodeURIComponent(c.name)}" data-jump="${s.id}">${s.title}</a>`).join('')}
          </div>
          ${related.length ? `<div class="block"><h4>Related commands</h4>${related.map(r => `<a class="mono" href="${cmdHref(r.name)}">${esc(r.name)}</a>`).join('')}</div>` : ''}
        </aside>
      </div>`;
    document.querySelectorAll('[data-jump]').forEach(a => a.addEventListener('click', e => {
      e.preventDefault();
      document.getElementById(a.dataset.jump).scrollIntoView({ behavior: 'smooth' });
    }));
    scrollTo(0, 0);
  }

  // ---------- global events ----------
  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-copy]');
    if (!btn) return;
    const done = () => { const t = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => (btn.textContent = t), 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(btn.dataset.copy).then(done, () => {});
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      e.preventDefault();
      if (parseHash().view !== 'explore') location.hash = '#/';
      setTimeout(() => document.getElementById('q')?.focus(), 0);
    }
  });

  let lastView = null;
  function route() {
    const r = parseHash();
    if (r.view === 'cmd') renderCommand(r.name);
    else if (lastView !== 'explore' || !document.getElementById('q')) renderExplorer(r);
    lastView = r.view;
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
