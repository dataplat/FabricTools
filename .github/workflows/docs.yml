name: Documentation website

# Builds the documentation website from docs/en-US (site/Build-DocsSite.ps1).
# - Pull requests: build only; the site is attached to the run as the 'docs-site' artifact for review.
# - Push to main / manual run on main: build and deploy to GitHub Pages.
# Requires Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - site/**
      - CHANGELOG.md
      - .github/workflows/docs.yml
  pull_request:
    branches:
      - develop
      - main
    paths:
      - docs/**
      - site/**
      - CHANGELOG.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Build documentation website
        shell: pwsh
        run: ./site/Build-DocsSite.ps1 -OutputPath ./output/site -Branch '${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}'

      - name: Upload site for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: output/site/
          include-hidden-files: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/site/

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
